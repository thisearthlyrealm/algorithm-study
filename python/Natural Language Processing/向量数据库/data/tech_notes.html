<h1>向量数据库技术说明</h1>
<p>Embedding 模型可以将文本转换为高维向量，使语义相近的文本在向量空间中距离更近。</p>
<p>FAISS、Chroma、Milvus 和 Qdrant 都可用于向量检索。FAISS 适合本地实验，支持余弦相似度和欧氏距离等检索方式。</p>
<p>文本切片会影响检索效果。切片过短可能丢失上下文，切片过长会导致主题混杂。常见策略包括按段落切片、按语义边界切片和固定长度滑动窗口。</p>
<p>相似性检索通常返回 Top-K 结果，并结合元数据展示来源、章节、切片序号和相似度分数。</p>
